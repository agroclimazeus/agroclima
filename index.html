<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agroclima Macro</title>
<style>
:root { --logo-f: none; --bg: #f4f5f2; --card: #fff; --ink: #15202b; --muted: #5b6573; --line: #d9dde3; --acento: #f05a28; --verde: #1d5b3a; --erro: #c62828; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #11161c; --card: #1a2129; --ink: #e8ebef; --muted: #9aa4b1; --line: #2e3844; --logo-f: brightness(0) invert(1); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #11161c; --card: #1a2129; --ink: #e8ebef; --muted: #9aa4b1; --line: #2e3844; --logo-f: brightness(0) invert(1); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
.card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px 22px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
.logo { display: block; max-width: 190px; max-height: 64px; margin: 0 0 18px; filter: var(--logo-f); }
h1 { font-size: 18px; margin: 0 0 4px; }
p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: transparent; color: inherit; }
input:focus { outline: 2px solid var(--acento); outline-offset: 1px; border-color: transparent; }
.lembrar { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--muted); margin-top: 14px; }
button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px; background: var(--verde); color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.msg { min-height: 20px; margin-top: 12px; font-size: 13.5px; color: var(--erro); }
.msg.ok { color: var(--muted); }
.rodape { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>

  <h1>Agroclima Macro</h1>
  <p class="sub">Previsão do tempo e tendências climáticas. Área restrita: entre com o usuário e a senha que você recebeu.</p>
  <label for="u">Usuário</label>
  <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="s">Senha</label>
  <input type="password" id="s" name="password" autocomplete="current-password" required>
  <label class="lembrar"><input type="checkbox" id="lembrar"> Manter conectado neste dispositivo</label>
  <button id="b">Entrar</button>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
  <div class="rodape">Conteúdo protegido com criptografia AES-256</div>
</form>
<script>
const ACESSOS = {"5667ef73dac709effcfdc518a98ea9238365ec62b0eb5f478392e28818a2efd5": {"s": "XKVoO4z4kfO0ntwM2sb9fg==", "w": "kzPRjmwr1TPUWpF9EUJ3ZO/ZLQ8kieiopArmQIcX8hx7ZjrBmIXq/H/gYWRpsdYzqAv76xahIWPfoxnU"}}, ITER = 600000, CHAVE = "prev-acesso", ARQ = "pagina.bin", FB = {"projectId": "agroclima-zeus", "apiKey": "AIzaSyAHA-qaG9Px2YOAHge1vatlKZmGHz-USSc"};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const texto = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const m = document.getElementById("m"), bt = document.getElementById("b");
const msg = (t, ok) => { m.textContent = t; m.className = "msg" + (ok ? " ok" : ""); };
const guardado = () => { try { return sessionStorage.getItem(CHAVE) || localStorage.getItem(CHAVE); } catch (e) { return null; } };
const esquecer = () => { try { [CHAVE, "prev-fb"].forEach(k => { sessionStorage.removeItem(k); localStorage.removeItem(k); }); } catch (e) {} };
// projetos compartilhados: entra também na conta do Firebase (mesmo login e senha); se falhar, a página abre igual
async function entrarProjetos(login, senha, guardar) {
  if (!FB) return;
  try {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB.apiKey}`, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: `${login.trim().toLowerCase()}@usuarios.agroclima.app`, password: senha, returnSecureToken: true }) });
    const j = await r.json();
    if (j.refreshToken) guardar.setItem("prev-fb", JSON.stringify({ rt: j.refreshToken, login: login.trim().toLowerCase() }));
  } catch (e) {}
}

async function sha256(t) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function chaveDoUsuario(login, senha) {
  const a = ACESSOS[await sha256(login.trim().toLowerCase())];
  if (!a) return null;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(a.s), iterations: ITER },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const w = bytes(a.w);
  try { return await crypto.subtle.decrypt({ name: "AES-GCM", iv: w.slice(0, 12) }, kek, w.slice(12)); }
  catch (e) { return null; }  // senha errada
}
async function abrir(bruta) {
  const k = await crypto.subtle.importKey("raw", bruta, "AES-GCM", false, ["decrypt"]);
  msg("Carregando a previsão…", true);
  const r = await fetch(ARQ, { cache: "no-cache" });
  if (!r.ok) throw new Error("arquivo da previsão indisponível (" + r.status + ")");
  const buf = ARQ.endsWith(".txt") ? bytes((await r.text()).trim()) : new Uint8Array(await r.arrayBuffer());  // .txt: o mesmo conteúdo cifrado, em base64
  const zip = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12));  // falha se a chave mudou
  const html = await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
// sessão já aberta neste navegador (também usada quando a página recarrega com a previsão nova)
(async () => {
  const g = guardado();
  if (!g) return document.getElementById("u").focus();
  bt.disabled = true;
  try { await abrir(bytes(g)); }
  catch (e) { esquecer(); bt.disabled = false; msg("Sua sessão expirou. Entre novamente."); }
})();
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  if (!window.crypto?.subtle || !window.DecompressionStream) return msg("Este navegador não é compatível. Use Chrome, Edge, Safari ou Firefox atualizados.");
  bt.disabled = true; msg("Verificando…", true);
  try {
    const bruta = await chaveDoUsuario(document.getElementById("u").value, document.getElementById("s").value);
    if (!bruta) { await new Promise(r => setTimeout(r, 600)); bt.disabled = false; return msg("Usuário ou senha incorretos."); }
    const guardar = document.getElementById("lembrar").checked ? localStorage : sessionStorage;
    try { guardar.setItem(CHAVE, texto(bruta)); } catch (e) {}
    await entrarProjetos(document.getElementById("u").value, document.getElementById("s").value, guardar);
    await abrir(bruta);
  } catch (e) { bt.disabled = false; msg("Não foi possível abrir: " + e.message); }
};
</script>
